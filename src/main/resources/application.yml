server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: clinica

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/clinica?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:12711271**12}
    driver-class-name: com.mysql.cj.jdbc.Driver

    hikari:
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update

    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

jwt:
  secret: "assistencia-clinica-jwt-chave-local-minimo-32-caracteres-para-hs256"
  expiration-ms: 86400000

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    org.hibernate.orm.jdbc: WARN